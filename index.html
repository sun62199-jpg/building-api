<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>건축물 요약 조회</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 16px;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        margin-top: 8px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      pre {
        background: #f5f5f5;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 12px;
        border-radius: 4px;
        max-height: 500px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>건축물 요약 조회</h1>
    <p>도로명 주소를 입력하고 “조회” 버튼을 눌러보세요.</p>

    <input
      id="addrInput"
      type="text"
      placeholder="예) 경기도 양주시 옥정서로 254"
    />
    <br />
    <button id="searchBtn">조회</button>

    <h2>결과</h2>
    <pre id="resultArea">아직 조회된 결과가 없습니다.</pre>

    <script>
      const input = document.getElementById("addrInput");
      const btn = document.getElementById("searchBtn");
      const resultArea = document.getElementById("resultArea");

      async function search() {
        const addr = input.value.trim();
        if (!addr) {
          alert("주소를 입력해주세요.");
          return;
        }

        resultArea.textContent = "조회 중...";

        try {
          const res = await fetch(
            "/summary?addr=" + encodeURIComponent(addr)
          );
          const data = await res.json();

          if (!res.ok) {
            resultArea.textContent =
              "오류: " + (data.detail || JSON.stringify(data, null, 2));
            return;
          }

          resultArea.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          resultArea.textContent = "요청 실패: " + err;
        }
      }

      btn.addEventListener("click", search);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") search();
      });
    </script>
  </body>
</html>
