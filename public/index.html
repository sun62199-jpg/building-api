<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>건축물 조회기</title>
  <style>
    body { font-family: Arial; padding: 40px; }
    input { padding: 10px; width: 300px; }
    button { padding: 10px 20px; }
    .result { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>건축물 다중이용 여부 조회 - 양주출장소 김영선</h1>

  <input id="addr" placeholder="주소를 입력하세요 (예: 경기도 양주시 옥정서로 254)" />
  <button onclick="search()">조회</button>

  <div class="result" id="result"></div>

  <script>
    async function search() {
      const addr = document.getElementById("addr").value;
      const resultBox = document.getElementById("result");
      resultBox.innerHTML = "조회 중...";

      try {
        const res = await fetch(`/summary?addr=${encodeURIComponent(addr)}`);
        const data = await res.json();

        if (data.error) {
          resultBox.innerHTML = `❌ 오류: ${data.error}\n${data.detail || ""}`;
          return;
        }

        // 다중이용건축물 여부와 판단 근거만 표시
        resultBox.innerHTML = `
주소: ${data.주소}
다중이용건축물: ${data.다중이용건축물 ? "✅ 예" : "❌ 아니오"}
판단 근거: ${data.판단이유}
        `;
      } catch (err) {
        resultBox.innerHTML = `❌ 조회 실패: ${err}`;
      }
    }
  </script>
</body>
</html>
