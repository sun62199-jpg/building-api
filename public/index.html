<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>건축물 종합 판정 시스템</title>
    <style>
        /* 모바일 최적화 스타일 */
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px 15px; 
            background-color: #f4f6f9; 
            color: #2c3e50; 
            line-height: 1.5;
        }
        .container { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            max-width: 500px; 
            margin: 0 auto; 
        }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 25px; font-size: 20px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input { 
            flex: 1; 
            padding: 14px; 
            border: 2px solid #eef2f6; 
            border-radius: 12px; 
            font-size: 16px; 
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #1a73e8; }
        button { 
            padding: 0 18px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 15px;
            white-space: nowrap;
        }
        #result { margin-top: 25px; display: none; border-top: 2px solid #f4f6f9; }
        .row { 
            display: flex; 
            flex-direction: column; 
            padding: 15px 0; 
            border-bottom: 1px solid #f8f9fa; 
        }
        @media (min-width: 380px) {
            .row { flex-direction: row; justify-content: space-between; align-items: flex-start; }
            .label { margin-bottom: 0; min-width: 100px; }
            .value { text-align: right; }
        }
        .label { font-weight: 500; color: #7f8c8d; font-size: 14px; margin-bottom: 4px; }
        .value { font-weight: 700; color: #2c3e50; font-size: 15px; word-break: break-all; flex: 1; }
        .badge { 
            display: inline-block; 
            padding: 4px 10px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: bold; 
            background: #e8f0fe; 
            color: #1a73e8; 
            margin-top: 5px;
        }
        .loading { text-align: center; display: none; color: #666; margin: 20px 0; font-size: 14px; }
        /* 추가 정보(층수/면적) 스타일 */
        .info-text { font-size: 12px; color: #1a73e8; font-weight: normal; display: block; margin-top: 4px; }
        
        .disclaimer { 
            margin-top: 30px; 
            padding: 15px; 
            background: #fff9f9; 
            border: 1px solid #ffebeb; 
            border-radius: 12px; 
            font-size: 12px; 
            color: #a34e4e; 
            text-align: center; 
            word-break: keep-all; 
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏢 건축물 종합 판정</h2>
        <div class="input-group">
            <input type="text" id="evNo" placeholder="승강기번호 7자리" maxlength="7" inputmode="numeric">
            <button onclick="check()">조회</button>
        </div>
        <div id="loading" class="loading">단지 데이터 통합 분석 중...</div>

        <div id="result">
            <div class="row"><span class="label">건물이름</span><span id="buldNm" class="value"></span></div>
            <div class="row"><span class="label">상세주소</span><span id="addr" class="value"></span></div>
            <div class="row">
                <span class="label">다중이용 분류</span>
                <div>
                    <span id="multiType" class="badge"></span>
                    <span id="subInfo" class="info-text"></span>
                </div>
            </div>
            <div class="row"><span class="label">집합건축물</span><span id="isColl" class="value"></span></div>
            <div class="row"><span class="label">법정필수</span><span id="isMand" class="value"></span></div>
        </div>

        <div class="disclaimer">
            ⚠️ 해당 정보는 단지 전체(지번 기준)를 통합 분석한 결과입니다.<br>
            <strong>※ 주소 미출력 시 공단 API 정보 부재 승강기입니다.</strong>
        </div>
    </div>

    <script>
        async function check() {
            const evNo = document.getElementById('evNo').value;
            const resDiv = document.getElementById('result');
            const loader = document.getElementById('loading');

            if(evNo.length < 7) return alert('번호 7자리를 입력하세요.');
            
            resDiv.style.display = 'none';
            loader.style.display = 'block';

            try {
                const res = await fetch('/api/summary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ addr: evNo })
                });
                const data = await res.json();
                if(data.error) throw new Error(data.error);

                document.getElementById('buldNm').innerText = data.buldNm;
                document.getElementById('addr').innerText = data.address;
                document.getElementById('multiType').innerText = data.multiType;
                document.getElementById('isColl').innerText = data.isCollective;
                document.getElementById('isMand').innerText = data.isMandatory;
                
                // 통합 판정 근거 (층수, 면적) 표시
                if(data.info) {
                    document.getElementById('subInfo').innerText = 
                        `기준: 최고 ${data.info.floor}층 / 대상면적 합계 ${data.info.area.toLocaleString()}㎡`;
                }

                resDiv.style.display = 'block';
            } catch (err) {
                alert(err.message);
            } finally {
                loader.style.display = 'none';
            }
        }
        document.getElementById('evNo').addEventListener('keypress', (e) => e.key === 'Enter' && check());
    </script>
</body>
</html>
