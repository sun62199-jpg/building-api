<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건축물 안전관리 의무교육 자동 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1E3A8A', 
                        'secondary': '#60A5FA',
                        'soft-red': '#FEF2F2',
                        'deep-red': '#DC2626',
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .json-viewer { 
            background-color: #F0F4F8; padding: 12px; border-radius: 6px; 
            max-height: 250px; overflow-y: scroll; white-space: pre-wrap; 
            word-wrap: break-word; font-family: monospace; font-size: 0.75rem; 
            border: 1px solid #E5E7EB; margin-top: 10px;
        }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen flex items-start justify-center">

    <div class="w-full max-w-lg bg-white shadow-2xl rounded-xl p-6 sm:p-8 mt-4 border border-gray-100">

        <header class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-primary mb-1">
                스마트 교육 안내 시스템
            </h1>
            <p class="text-gray-600 text-sm sm:text-base">
                건물 주소로 법정 의무교육을 확인하세요.
            </p>
        </header>

        <section class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <label class="block text-md font-semibold text-gray-700 mb-3">
                건물 주소 입력
            </label>
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3">
                <input type="text" id="addressInput" placeholder="예: 경기도 양주시 회천중앙로 282" 
                       class="flex-grow p-3 border-2 border-gray-300 rounded-lg text-sm focus:border-secondary focus:ring focus:ring-secondary focus:ring-opacity-50 transition duration-150 shadow-sm">
                <button id="checkButton"
                        class="px-5 py-3 bg-primary text-white font-bold rounded-lg hover:bg-secondary transition duration-300 shadow-md disabled:opacity-50 text-sm whitespace-nowrap">
                    확인
                </button>
            </div>
        </section>

        <section class="p-4 border-4 border-dashed border-gray-200 bg-white rounded-xl min-h-[180px]">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                조회 결과
            </h2>

            <div id="loadingIndicator" class="hidden text-center py-8">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-t-4 border-secondary border-t-transparent rounded-full mb-3"></div>
                <p class="text-gray-500 text-sm font-medium">데이터 분석 중...</p>
            </div>

            <div id="errorMessage" class="hidden p-3 bg-soft-red border border-deep-red text-deep-red rounded-lg text-sm font-medium mb-4 flex items-start">
                <span class="mr-2">❌</span>
                <span id="errorText"></span>
            </div>

            <div id="resultOutput" class="space-y-4">
                <p class="text-gray-400 text-sm italic text-center py-6">주소를 입력하고 확인 버튼을 눌러주세요.</p>
            </div>
        </section>
        
        <section class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200 text-xs">
             <h3 class="font-semibold text-primary mb-2">💡 이용 안내</h3>
             <ul class="list-disc list-inside text-gray-600 space-y-1">
                 <li>건축물대장과 승강기 정보를 교차 분석하여 안내합니다.</li>
                 <li>데이터가 일치하지 않을 경우 '확인 필요'로 표시됩니다.</li>
             </ul>
         </section>
    </div>

    <script>
        const BTN = document.getElementById('checkButton');
        const INPUT = document.getElementById('addressInput');
        const RESULT = document.getElementById('resultOutput');
        const ERROR = document.getElementById('errorMessage');
        const ERR_TEXT = document.getElementById('errorText');
        const LOADER = document.getElementById('loadingIndicator');

        const ED_MULTI = "비상구출운전 승강기관리교육(12시간)";
        const ED_GEN = "승강기 관리교육(4시간)";
        const ED_CHECK = "⚠️ 확인 필요 (승강기 보유 시 교육 필수)";
        const ED_NONE = "교육 의무 없음";

        window.toggleJson = function() {
            const viewer = document.getElementById('jsonViewer');
            viewer.classList.toggle('hidden');
        };

        async function search() {
            const addr = INPUT.value.trim();
            if (!addr) {
                ERR_TEXT.textContent = "주소를 입력해주세요.";
                ERROR.classList.remove('hidden');
                return;
            }

            BTN.disabled = true;
            LOADER.classList.remove('hidden');
            RESULT.classList.add('hidden');
            ERROR.classList.add('hidden');
            RESULT.innerHTML = '';

            try {
                const res = await fetch('/api/summary', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ addr })
                });
                
                const data = await responseJsonSafe(res);

                if (!res.ok || data.error) {
                    throw new Error(data.detail || data.error || '알 수 없는 서버 오류');
                }

                // --- 데이터 매핑 ---
                const isMulti = data.analysis.llmFinalDecision === '예';
                const isFallback = data.status === 'ok_fallback'; // MOLIT 실패, Elevator 성공
                const isMolitSuccess = data.status === 'ok';      // MOLIT 성공
                
                const molitMaxF = data.summaryDetails.최고지상층수 || 0;
                const elevMaxF = data.summaryDetails.elevatorMaxFloor || 0;
                const finalMaxF = Math.max(molitMaxF, elevMaxF);
                const area = data.summaryDetails.가목_연면적_합계?.toFixed(2) || '0.00';
                const elevCount = data.summaryDetails.elevatorCount || 0;
                
                // --- 🚨 최종 판단 로직 ---
                let edu = ED_NONE;
                let badge = '대상 아님';
                let color = 'gray'; 
                let decisionNote = data.analysis.llmReason;

                if (isMulti || finalMaxF >= 16) { 
                    // 1. [교육 대상 - 특수]
                    edu = ED_MULTI;
                    badge = '교육 대상'; // 🚨 용어 통일
                    color = 'red';
                    if (isFallback) decisionNote += " (승강기 데이터 기준 16층 이상이므로 특수 관리 교육 대상입니다.)";
                
                } else if (isMolitSuccess && finalMaxF >= 2) {
                    // 2. [교육 대상 - 일반 (MOLIT 성공)]
                    edu = ED_GEN;
                    badge = '교육 대상'; // 🚨 용어 통일
                    color = 'green';
                    if (elevCount === 0) decisionNote += " (승강기 정보가 조회되지 않았으나, 건축물 층수를 고려하여 승강기 보유로 가정합니다.)";

                } else if (isFallback && elevCount > 0) {
                    // 3. [교육 대상 - 일반 (MOLIT 실패, 승강기 있음)] 
                    // 🚨 비어있던 로직 채움: 승강기 있으면 무조건 교육 대상
                    edu = ED_GEN;
                    badge = '교육 대상'; // 🚨 용어 통일
                    color = 'green';
                    if (finalMaxF < 16) decisionNote = "건축물대장은 없으나 승강기 정보가 확인되었습니다. 16층 미만이므로 일반 관리교육 대상입니다.";

                } else if (isFallback && finalMaxF < 16) {
                    // 4. [확인 필요] (승강기 정보는 있는데 카운트가 0이거나 애매한 경우)
                    edu = ED_CHECK;
                    badge = '확인 필요';
                    color = 'yellow';
                    decisionNote = "승강기 정보는 확인되나, 정확한 대수나 용도를 확인할 수 없습니다. 현장 확인이 필요합니다.";

                } else if (finalMaxF >= 2) {
                    // 5. [확인 필요] (MOLIT O, 승강기 X, 2층 이상 - 위 2번 로직에서 처리되므로 사실상 여기 안 옴)
                    edu = ED_CHECK;
                    badge = '확인 필요';
                    color = 'yellow';
                    
                } else { 
                    // 6. [대상 아님]
                    edu = ED_NONE;
                    badge = '대상 아님';
                    color = 'gray';
                }

                // --- 데이터 소스 텍스트 ---
                let rawDataSourceName = isFallback ? '승강기 정보 (FALLBACK)' : '건축물대장 (MOLIT)';
                let rawDataForViewer = isFallback ? data.summaryDetails : data.summaryDetails.다중이용건물;
                const elevSourceText = data.summaryDetails.elevatorSource || '-';

                // --- UI 렌더링 ---
                const colorMap = {
                    red: { border: 'border-red-500', bg: 'bg-red-100', text: 'text-red-800', title: 'text-red-600' },
                    green: { border: 'border-green-500', bg: 'bg-green-100', text: 'text-green-800', title: 'text-green-600' },
                    yellow: { border: 'border-yellow-500', bg: 'bg-yellow-100', text: 'text-yellow-800', title: 'text-yellow-600' },
                    gray: { border: 'border-gray-400', bg: 'bg-gray-200', text: 'text-gray-800', title: 'text-gray-600' }
                };
                const theme = colorMap[color];

                RESULT.innerHTML = `
                    <div class="border-l-4 ${theme.border} pl-4 py-1">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="px-2 py-0.5 ${theme.bg} ${theme.text} text-xs font-bold rounded mb-1 inline-block">${badge}</span>
                                <p class="text-sm text-gray-700 font-bold leading-tight">${data.addressInfo.roadAddr}</p>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 p-3 rounded-lg mb-3 border border-gray-200">
                            <p class="text-xs text-gray-500 mb-1 font-bold uppercase">안내 사항</p>
                            <p class="font-extrabold ${theme.title} text-lg leading-snug break-keep">${edu}</p>
                            <p class="text-xs text-gray-500 mt-2 border-t border-gray-200 pt-2 leading-relaxed">${decisionNote}</p>
                        </div>

                        <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm">
                            <h6 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">📊 정보 확인 (데이터 비교)</h6>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                                <div class="font-bold text-primary border-b pb-1">🏛️ 건축물대장</div>
                                <div class="font-bold text-primary border-b pb-1">🛗 승강기 정보</div>
                                
                                <div class="pt-1 text-gray-600">최고층: <span class="font-bold text-black">${molitMaxF}F</span></div>
                                <div class="pt-1 text-gray-600">최고층: <span class="font-bold text-black">${elevMaxF}F</span></div>
                                
                                <div class="text-gray-600">가목면적: <span class="font-bold text-black">${area}㎡</span></div>
                                <div class="text-gray-600">보유대수: <span class="font-bold text-black">${elevCount}대</span></div>
                                
                                <div class="text-gray-400 col-span-2 mt-1 pt-1 border-t text-[10px]">
                                    * 승강기 데이터 상태: ${elevSourceText}
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-3 text-right">
                            <button onclick="toggleJson()" class="text-xs text-gray-400 hover:text-blue-600 underline transition">
                                ${rawDataSourceName} 원본 보기
                            </button>
                        </div>
                        <div id="jsonViewer" class="json-viewer hidden">${JSON.stringify(rawDataForViewer, null, 2)}</div>
                    </div>
                `;
                RESULT.classList.remove('hidden');

            } catch (e) {
                ERR_TEXT.textContent = e.message;
                ERROR.classList.remove('hidden');
            } finally {
                LOADER.classList.add('hidden');
                BTN.disabled = false;
            }
        }

        async function responseJsonSafe(res) {
            const text = await res.text();
            try { return JSON.parse(text); } 
            catch { return { error: '서버 응답 형식 오류', detail: text.substring(0, 100) }; }
        }

        BTN.addEventListener('click', search);
        INPUT.addEventListener('keydown', e => e.key === 'Enter' && search());
    </script>
</body>
</html>
