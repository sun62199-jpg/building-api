<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건축물 안전관리 의무교육 자동 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    </head>
<body class="p-4 sm:p-8 min-h-screen flex items-start justify-center">

    <div id="resultOutput"></div>
    <script>
        // ... (기본 변수 선언)

        async function search() {
            // ... (초기화 로직)

            try {
                const res = await fetch('/api/summary', { /* POST */ });
                const json = await res.json();

                if (!res.ok || json.error) throw new Error(json.error || '오류');

                // 🚨 Server-Driven UI Rendering 🚨
                // 서버가 준 데이터를 그대로 변수에 할당
                const { uiRender, data, raw } = json;

                // 색상 매핑 (서버는 'red'라고만 줌 -> 클라이언트가 스타일 결정)
                const colorMap = {
                    red: { border: 'border-red-500', bg: 'bg-red-100', text: 'text-red-800', title: 'text-red-600' },
                    blue: { border: 'border-blue-500', bg: 'bg-blue-100', text: 'text-blue-800', title: 'text-blue-600' },
                    yellow: { border: 'border-yellow-500', bg: 'bg-yellow-100', text: 'text-yellow-800', title: 'text-yellow-600' },
                    gray: { border: 'border-gray-400', bg: 'bg-gray-200', text: 'text-gray-800', title: 'text-gray-600' }
                };
                const theme = colorMap[uiRender.colorTheme];

                // HTML 생성 (로직 없음, 매핑만 있음)
                RESULT.innerHTML = `
                    <div class="border-l-4 ${theme.border} pl-4 py-1">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="px-2 py-0.5 ${theme.bg} ${theme.text} text-xs font-bold rounded mb-1 inline-block">
                                    ${uiRender.badgeText}
                                </span>
                                <p class="text-sm text-gray-700 font-bold leading-tight">${data.address}</p>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 p-3 rounded-lg mb-3 border border-gray-200">
                            <p class="text-xs text-gray-500 mb-1 font-bold uppercase">안내 사항</p>
                            <p class="font-extrabold ${theme.title} text-lg leading-snug break-keep">
                                ${uiRender.mainTitle}
                            </p>
                            <p class="text-xs text-gray-500 mt-2 border-t border-gray-200 pt-2 leading-relaxed">
                                ${uiRender.description}
                            </p>
                        </div>

                        <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm">
                            <h6 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">📊 정보 확인</h6>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                                <div class="font-bold text-primary border-b pb-1">🏛️ 건축물대장</div>
                                <div class="font-bold text-primary border-b pb-1">🛗 승강기 정보</div>
                                
                                <div class="pt-1 text-gray-600">최고층: <b>${data.molit.floor}F</b></div>
                                <div class="pt-1 text-gray-600">최고층: <b>${data.elevator.floor}F</b></div>
                                
                                <div class="text-gray-600">가목면적: <b>${data.molit.area}㎡</b></div>
                                <div class="text-gray-600">승강기수: <b>${data.elevator.count}대</b></div>
                                
                                <div class="text-gray-400 col-span-2 mt-1 pt-1 border-t text-[10px]">
                                    * 데이터 출처: ${data.source}
                                </div>
                            </div>
                        </div>
                        
                         <div class="mt-3 text-right">
                            <button onclick="toggleJson()" class="text-xs text-gray-400 hover:text-blue-600 underline transition">상세 원본 보기</button>
                        </div>
                        <div id="jsonViewer" class="json-viewer hidden mt-2">${JSON.stringify(raw, null, 2)}</div>
                    </div>
                `;
                RESULT.classList.remove('hidden');

            } catch (e) { /* 에러 처리 */ } 
            finally { /* 로딩 종료 */ }
        }
        // ...
    </script>
</body>
</html>
