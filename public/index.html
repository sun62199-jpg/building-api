<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건축물 종합 판정 시스템</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #1a73e8; }
        button { padding: 14px 24px; background: #1a73e8; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #1557b0; }
        
        #result { margin-top: 30px; display: none; border-top: 2px solid #f0f2f5; padding-top: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f8f9fa; }
        .label { font-weight: 500; color: #666; }
        .value { font-weight: 700; color: #111; text-align: right; word-break: keep-all; }
        .badge { padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; background: #e8f0fe; color: #1a73e8; }
        
        .loading { text-align: center; display: none; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏢 건축물 종합 판정</h2>
        <div class="input-group">
            <input type="text" id="evNo" placeholder="승강기번호 7자리 입력" maxlength="7">
            <button onclick="check()">조회</button>
        </div>
        <div id="loading" class="loading">데이터를 분석 중입니다...</div>

        <div id="result">
            <div class="row">
                <span class="label">건물이름</span>
                <span id="buldNm" class="value">-</span>
            </div>
            <div class="row">
                <span class="label">상세주소</span>
                <span id="addr" class="value">-</span>
            </div>
            <div class="row">
                <span class="label">다중이용 분류</span>
                <span id="multiType" class="badge">-</span>
            </div>
            <div class="row">
                <span class="label">집합건축물 여부</span>
                <span id="isColl" class="value">-</span>
            </div>
            <div class="row">
                <span class="label">법정필수 승강기</span>
                <span id="isMand" class="value">-</span>
            </div>
        </div>
    </div>

    <script>
        async function check() {
            const evNo = document.getElementById('evNo').value;
            const resDiv = document.getElementById('result');
            const loader = document.getElementById('loading');

            if(evNo.length < 7) return alert('승강기번호 7자리를 정확히 입력해주세요.');
            
            resDiv.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/api/summary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ addr: evNo })
                });
                const data = await response.json();
                
                if(data.error) throw new Error(data.error);

                document.getElementById('buldNm').innerText = data.buldNm || '정보없음';
                document.getElementById('addr').innerText = data.address || '정보없음';
                document.getElementById('multiType').innerText = data.multiType;
                document.getElementById('isColl').innerText = data.isCollective;
                document.getElementById('isMand').innerText = data.isMandatory;
                
                resDiv.style.display = 'block';
            } catch (err) {
                alert('조회 중 오류가 발생했습니다: ' + err.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        // 엔터키 지원
        document.getElementById('evNo').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') check();
        });
    </script>
</body>
</html>
