<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승강기 & 건축물 판정기</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; line-height: 1.6; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        #result { margin-top: 20px; display: none; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .label { font-weight: bold; color: #555; }
        .value { color: #000; font-weight: 600; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏢 건축물 종합 판정</h2>
        <p>승강기 번호(7자리)를 입력하세요.</p>
        <input type="text" id="evNo" placeholder="예: 1234567" maxlength="7">
        <button onclick="check()">조회하기</button>

        <div id="result">
            <div class="row"><span class="label">주소</span><span id="addr" class="value"></span></div>
            <div class="row"><span class="label">다중이용 분류</span><span id="multiType" class="badge"></span></div>
            <div class="row"><span class="label">집합건축물</span><span id="isColl" class="value"></span></div>
            <div class="row"><span class="label">법정필수승강기</span><span id="isMand" class="value"></span></div>
        </div>
    </div>

    <script>
        async function check() {
            const evNo = document.getElementById('evNo').value;
            if(!evNo) return alert('번호를 입력하세요');
            
            const res = await fetch('/api/summary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ addr: evNo })
            });
            const data = await res.json();
            
            if(data.error) return alert(data.error);

            document.getElementById('result').style.display = 'block';
            document.getElementById('addr').innerText = data.address;
            document.getElementById('multiType').innerText = data.multiType;
            document.getElementById('isColl').innerText = data.isCollective;
            document.getElementById('isMand').innerText = data.isMandatory;
        }
    </script>
</body>
</html>
