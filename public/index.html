<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건축물 안전관리 의무교육 자동 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1E3A8A', 
                        'secondary': '#60A5FA',
                        'soft-red': '#FEF2F2',
                        'deep-red': '#DC2626',
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        /* JSON 뷰어 스타일 */
        .json-viewer { 
            background-color: #F0F4F8; 
            padding: 12px; 
            border-radius: 6px; 
            max-height: 250px; 
            overflow-y: scroll; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-family: monospace; 
            font-size: 0.75rem; 
            border: 1px solid #E5E7EB; 
            margin-top: 10px;
        }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen flex items-start justify-center">

    <div class="w-full max-w-lg bg-white shadow-2xl rounded-xl p-6 sm:p-8 mt-4 border border-gray-100">

        <header class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-primary mb-1">
                스마트 교육 안내_현재 V3.0김영선
            </h1>
            <p class="text-gray-600 text-sm">
                건물 주소로 법정 의무교육을 확인하세요.
            </p>
        </header>

        <section class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <label class="block text-md font-semibold text-gray-700 mb-3">
                건물 주소 입력
            </label>
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3">
                <input type="text" id="addressInput" placeholder="예: 경기도 양주시 회천중앙로 282" 
                       class="flex-grow p-3 border-2 border-gray-300 rounded-lg text-sm focus:border-secondary focus:ring focus:ring-secondary focus:ring-opacity-50 transition duration-150 shadow-sm">
                <button id="checkButton"
                        class="px-5 py-3 bg-primary text-white font-bold rounded-lg hover:bg-secondary transition duration-300 shadow-md disabled:opacity-50 text-sm whitespace-nowrap">
                    확인
                </button>
            </div>
        </section>

        <section class="p-4 border-4 border-dashed border-gray-200 bg-white rounded-xl min-h-[200px]">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                조회 결과
            </h2>

            <div id="loadingIndicator" class="hidden text-center py-8">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-t-4 border-secondary border-t-transparent rounded-full mb-3"></div>
                <p class="text-gray-500 text-sm font-medium">데이터 분석 중...</p>
            </div>

            <div id="errorMessage" class="hidden p-3 bg-soft-red border border-deep-red text-deep-red rounded-lg text-sm font-medium mb-4"></div>

            <div id="resultOutput" class="space-y-4">
                <p class="text-gray-400 text-sm italic text-center py-8">주소를 입력하고 확인 버튼을 눌러주세요.</p>
            </div>
        </section>
    </div>

    <script>
        const BTN = document.getElementById('checkButton');
        const INPUT = document.getElementById('addressInput');
        const RESULT = document.getElementById('resultOutput');
        const ERROR = document.getElementById('errorMessage');
        const LOADER = document.getElementById('loadingIndicator');

        const ED_MULTI = "비상구출운전 및 승강기관리 교육";
        const ED_GEN = "승강기 관리 교육 (일반)";
        const ED_NONE = "교육 의무 없음";

        // JSON 뷰어 토글 함수 (전역 스코프)
        window.toggleJson = function() {
            const viewer = document.getElementById('jsonViewer');
            viewer.classList.toggle('hidden');
        };

        async function search() {
            const addr = INPUT.value.trim();
            if (!addr) {
                ERROR.textContent = "주소를 입력해주세요.";
                ERROR.classList.remove('hidden');
                return;
            }

            // 상태 초기화
            BTN.disabled = true;
            LOADER.classList.remove('hidden');
            RESULT.classList.add('hidden');
            ERROR.classList.add('hidden');
            RESULT.innerHTML = ''; // 이전 결과 삭제

            try {
                const res = await fetch('/api/summary', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ addr })
                });
                const data = await responseJsonSafe(res);

                if (!res.ok || data.error) {
                    throw new Error(data.detail || data.error || '서버 오류');
                }

                // --- 데이터 매핑 ---
                const isMulti = data.analysis.llmFinalDecision === '예';
                const molitMaxF = data.summaryDetails.최고지상층수 || 0;
                const elevMaxF = data.summaryDetails.elevatorMaxFloor || 0;
                const finalMaxF = Math.max(molitMaxF, elevMaxF);
                const area = data.summaryDetails.가목_연면적_합계?.toFixed(2) || '0.00';
                const elevCount = data.summaryDetails.elevatorCount || 0;
                
                // --- 교육 판단 ---
                let edu = ED_NONE;
                let badge = '일반 관리';
                let color = 'green'; // green, red, yellow

                if (isMulti) {
                    edu = ED_MULTI;
                    badge = '특수 관리';
                    color = 'red';
                } else if (finalMaxF >= 16 || elevCount > 0) { 
                    edu = ED_GEN;
                }

                // 승강기 데이터 소스 텍스트
                const elevSource = data.summaryDetails.elevatorSource || '정보 없음';

                // --- UI 렌더링 ---
                RESULT.innerHTML = `
                    <div class="border-l-4 border-${color}-500 pl-4 py-2">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xl font-bold text-gray-800">${isMulti ? '다중이용 건축물' : '일반 건축물'}</span>
                            <span class="px-2 py-1 bg-${color}-100 text-${color}-800 text-xs font-bold rounded">${badge}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-4 font-medium">${data.addressInfo.roadAddr}</p>
                        
                        <div class="bg-gray-50 p-4 rounded-lg mb-4 border border-gray-100">
                            <p class="text-xs text-gray-500 mb-1 font-bold uppercase">필수 교육과정</p>
                            <p class="font-extrabold text-${color}-600 text-lg leading-tight">${edu}</p>
                            <p class="text-xs text-gray-500 mt-2 border-t border-gray-200 pt-2">${data.analysis.llmReason}</p>
                        </div>

                        <div class="grid grid-cols-2 gap-3 text-xs bg-white border border-gray-200 rounded-lg p-3 shadow-sm">
                            <div class="space-y-1">
                                <p class="font-bold text-primary flex items-center">
                                    🏛️ 건축물대장
                                </p>
                                <p class="text-gray-600">최고층: <span class="font-semibold text-black">${molitMaxF}F</span></p>
                                <p class="text-gray-600">가목 면적: <span class="font-semibold text-black">${area}㎡</span></p>
                                <p class="text-gray-600">총 건물: ${data.summaryDetails.총건물수}개</p>
                            </div>
                            <div class="space-y-1 border-l border-gray-100 pl-3">
                                <p class="font-bold text-primary flex items-center">
                                    🛗 승강기 정보
                                </p>
                                <p class="text-gray-600">최고층: <span class="font-semibold text-black">${elevMaxF}F</span></p>
                                <p class="text-gray-600">승강기: <span class="font-semibold text-black">${elevCount}대</span></p>
                                <p class="text-gray-400 text-[10px] truncate">${elevSource}</p>
                            </div>
                        </div>
                        
                        <div class="mt-3 text-right">
                            <button onclick="toggleJson()" class="text-xs text-gray-400 hover:text-blue-500 underline transition">상세 데이터 원본 보기</button>
                        </div>
                        <div id="jsonViewer" class="json-viewer hidden mt-2">${JSON.stringify(data.summaryDetails, null, 2)}</div>
                    </div>
                `;
                RESULT.classList.remove('hidden');

            } catch (e) {
                ERROR.textContent = e.message;
                ERROR.classList.remove('hidden');
            } finally {
                LOADER.classList.add('hidden');
                BTN.disabled = false;
            }
        }

        // 안전한 JSON 파싱 헬퍼
        async function responseJsonSafe(res) {
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch {
                return { error: '서버 응답 형식 오류', detail: text.substring(0, 100) };
            }
        }

        BTN.addEventListener('click', search);
        INPUT.addEventListener('keydown', e => e.key === 'Enter' && search());
    </script>
</body>
</html>
