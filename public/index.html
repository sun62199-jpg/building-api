<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건축물 안전관리 의무교육 자동 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1E3A8A', 
                        'secondary': '#60A5FA',
                        'soft-red': '#FEF2F2',
                        'deep-red': '#DC2626',
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .json-viewer { 
            background-color: #F0F4F8; padding: 12px; border-radius: 6px; 
            max-height: 250px; overflow-y: auto; white-space: pre-wrap; 
            word-wrap: break-word; font-family: monospace; font-size: 0.7rem; 
            border: 1px solid #E5E7EB; margin-top: 10px; color: #374151;
        }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen flex items-start justify-center">

    <div class="w-full max-w-lg bg-white shadow-2xl rounded-xl p-6 sm:p-8 mt-4 border border-gray-100">

        <header class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-primary mb-1">
                스마트 교육 안내 시스템
            </h1>
            <p class="text-gray-500 font-bold mt-1 text-sm">김영선</p>
            <p class="text-gray-600 text-sm sm:text-base mt-2">
                건물 주소로 법정 의무교육을 확인하세요.
            </p>
        </header>

        <section class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <label class="block text-md font-semibold text-gray-700 mb-3">
                건물 주소 입력
            </label>
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3">
                <input type="text" id="addressInput" placeholder="예: 경기도 양주시 회천중앙로 282" 
                       class="flex-grow p-3 border-2 border-gray-300 rounded-lg text-sm focus:border-secondary focus:ring focus:ring-secondary focus:ring-opacity-50 transition duration-150 shadow-sm">
                <button id="checkButton"
                        class="px-5 py-3 bg-primary text-white font-bold rounded-lg hover:bg-secondary transition duration-300 shadow-md disabled:opacity-50 text-sm whitespace-nowrap">
                    확인
                </button>
            </div>
        </section>

        <section class="p-4 border-4 border-dashed border-gray-200 bg-white rounded-xl min-h-[180px]">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                조회 결과
            </h2>

            <div id="loadingIndicator" class="hidden text-center py-8">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-t-4 border-secondary border-t-transparent rounded-full mb-3"></div>
                <p class="text-gray-500 text-sm font-medium">데이터 분석 중...</p>
            </div>

            <div id="errorMessage" class="hidden p-3 bg-soft-red border border-deep-red text-deep-red rounded-lg text-sm font-medium mb-4 flex items-start">
                <span class="mr-2">❌</span>
                <span id="errorText"></span>
            </div>

            <div id="resultOutput" class="space-y-4">
                <p class="text-gray-400 text-sm italic text-center py-6">주소를 입력하고 확인 버튼을 눌러주세요.</p>
            </div>
        </section>
        
        <section class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200 text-xs">
             <h3 class="font-semibold text-primary mb-2">💡 이용 안내</h3>
             <ul class="list-disc list-inside text-gray-600 space-y-1">
                 <li>건축물대장과 승강기 정보를 교차 분석하여 안내합니다.</li>
                 <li>데이터 불일치 시 현장 확인이 필요할 수 있습니다.</li>
             </ul>
         </section>
    </div>

    <script>
        const BTN = document.getElementById('checkButton');
        const INPUT = document.getElementById('addressInput');
        const RESULT = document.getElementById('resultOutput');
        const ERROR = document.getElementById('errorMessage');
        const ERR_TEXT = document.getElementById('errorText');
        const LOADER = document.getElementById('loadingIndicator');

        window.toggleJson = function() {
            const viewer = document.getElementById('jsonViewer');
            viewer.classList.toggle('hidden');
        };

        async function search() {
            const addr = INPUT.value.trim();
            if (!addr) {
                ERR_TEXT.textContent = "주소를 입력해주세요.";
                ERROR.classList.remove('hidden');
                return;
            }

            BTN.disabled = true;
            LOADER.classList.remove('hidden');
            RESULT.classList.add('hidden');
            ERROR.classList.add('hidden');
            RESULT.innerHTML = '';

            try {
                const res = await fetch('/api/summary', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ addr })
                });
                
                // 안전한 JSON 파싱
                const json = await responseJsonSafe(res);

                if (!res.ok || json.error) {
                    throw new Error(json.detail || json.error || '알 수 없는 서버 오류');
                }

                // 🚨 Server-Driven UI Logic
                // 서버가 준 uiRender와 데이터를 사용하여 화면 구성
                const { uiRender, data, raw, addressInfo, summaryDetails } = json;

                // 색상 매핑 (서버가 준 colorTheme: green/blue/yellow/gray)
                const colorMap = {
                    green: { border: 'border-green-500', bg: 'bg-green-100', text: 'text-green-800', title: 'text-green-600', ruleBg: 'bg-green-50', ruleText: 'text-green-700' },
                    blue: { border: 'border-blue-500', bg: 'bg-blue-100', text: 'text-blue-800', title: 'text-blue-600', ruleBg: 'bg-blue-50', ruleText: 'text-blue-700' },
                    yellow: { border: 'border-yellow-500', bg: 'bg-yellow-100', text: 'text-yellow-800', title: 'text-yellow-600', ruleBg: 'bg-yellow-50', ruleText: 'text-yellow-700' },
                    gray: { border: 'border-gray-400', bg: 'bg-gray-200', text: 'text-gray-800', title: 'text-gray-600', ruleBg: 'bg-gray-100', ruleText: 'text-gray-600' }
                };
                const theme = colorMap[uiRender.colorTheme] || colorMap['gray'];

                // 규정 판단 텍스트 (Green이면 다중이용, 그외 일반)
                const ruleText = uiRender.colorTheme === 'green' ? '다중이용건축물' : '일반건축물';
                const ruleIcon = uiRender.colorTheme === 'green' ? '🏢' : '🏠';

                // HTML 렌더링 (오류 났던 addressInfo 부분 수정됨)
                RESULT.innerHTML = `
                    <div class="border-l-4 ${theme.border} pl-4 py-1">
                        
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="px-2 py-0.5 ${theme.bg} ${theme.text} text-xs font-bold rounded mb-1 inline-block">
                                    ${uiRender.badgeText}
                                </span>
                                <p class="text-sm text-gray-700 font-bold leading-tight">${addressInfo.roadAddr}</p>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 p-3 rounded-lg mb-3 border border-gray-200">
                            <p class="text-xs text-gray-500 mb-1 font-bold uppercase">안내 사항</p>
                            <p class="font-extrabold ${theme.title} text-lg leading-snug break-keep">
                                ${uiRender.mainTitle}
                            </p>
                        </div>

                        <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm mb-4">
                            <h6 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider flex items-center">
                                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                정보 확인
                            </h6>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                                <div class="font-bold text-primary border-b border-gray-300 pb-1">🏛️ 건축물대장</div>
                                <div class="font-bold text-primary border-b border-gray-300 pb-1">🛗 승강기 정보</div>
                                
                                <div class="pt-1 text-gray-700">최고층: <b>${data.molit.floor}F</b></div>
                                <div class="pt-1 text-gray-700">최고층: <b>${data.elevator.floor}F</b></div>
                                
                                <div class="text-gray-700">가목면적: <b>${data.molit.area}㎡</b></div>
                                <div class="text-gray-700">승강기수: <b>${data.elevator.count}대</b></div>
                                
                                <div class="text-gray-400 col-span-2 mt-1 pt-1 border-t border-gray-200 text-[10px]">
                                    * 데이터 출처: ${data.source}
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <div class="p-3 rounded-lg border border-gray-200 bg-white">
                                <p class="text-xs font-bold text-gray-600 mb-1 flex items-center">
                                    🏛️ 건축법 규정 판단
                                </p>
                                <p class="text-sm font-bold text-gray-800">
                                    ${ruleIcon} ${ruleText}
                                </p>
                            </div>

                            <div class="p-3 rounded-lg border ${theme.border} ${theme.ruleBg}">
                                <p class="text-xs font-bold ${theme.ruleText} mb-1 flex items-center">
                                    🤖 AI 종합 분석
                                </p>
                                <p class="text-xs text-gray-700 leading-relaxed text-justify">
                                    ${uiRender.description}
                                </p>
                            </div>
                        </div>
                        
                        <div class="mt-3 text-right">
                            <button onclick="toggleJson()" class="text-xs text-gray-400 hover:text-blue-600 underline transition">
                                상세 데이터 원본 보기
                            </button>
                        </div>
                        <div id="jsonViewer" class="json-viewer hidden mt-2">${JSON.stringify(raw, null, 2)}</div>
                    </div>
                `;
                RESULT.classList.remove('hidden');

            } catch (e) {
                ERR_TEXT.textContent = e.message;
                ERROR.classList.remove('hidden');
            } finally {
                LOADER.classList.add('hidden');
                BTN.disabled = false;
            }
        }

        async function responseJsonSafe(res) {
            const text = await res.text();
            try { return JSON.parse(text); } 
            catch { return { error: '서버 응답 형식 오류', detail: text.substring(0, 100) }; }
        }

        BTN.addEventListener('click', search);
        INPUT.addEventListener('keydown', e => e.key === 'Enter' && search());
    </script>
</body>
</html>
