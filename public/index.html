<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다중이용건축물 판단기_테스트 v2.2 251118_20시05분</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .result-card { border-left: 5px solid; padding-left: 15px; margin-top: 20px; }
        .result-card.success { border-color: #28a745; }
        .result-card.fail { border-color: #dc3545; }
        .result-card.fallback { border-color: #ffc107; }
        .json-viewer { background-color: #e9ecef; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: scroll; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">다중이용건축물 판단기</h1>
        <div class="input-group mb-3">
            <input type="text" id="addressInput" class="form-control" placeholder="주소를 입력하세요 (예: 회천중앙로 282 또는 양주회천15단지)">
            <button class="btn btn-primary" id="searchBtn">조회</button>
        </div>
        <div id="loadingIndicator" class="text-center hidden">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">정보 조회 중...</p>
        </div>
        <div id="results" class="hidden">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const address = document.getElementById('addressInput').value;
            const resultsDiv = document.getElementById('results');
            const loadingIndicator = document.getElementById('loadingIndicator');
            resultsDiv.innerHTML = '';
            resultsDiv.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');

            try {
                const response = await fetch('/api/summary', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ addr: address }),
                });

                const data = await response.json();

                if (response.ok) {
                    let cardClass = '';
                    let statusText = '';
                    let rawDataSummary = '';
                    let rawDataSource = '';
                    let rawDataContent = '';

                    if (data.status === 'ok') {
                        cardClass = 'success';
                        statusText = '성공 (건축물대장 기반)';
                        rawDataSource = '건축물대장 (MOLIT) 상세';
                        rawDataContent = data.summaryDetails.다중이용건물; // MOLIT의 다중이용건물 목록
                        rawDataSummary = `
                            <p><strong>총 건물 수:</strong> ${data.summaryDetails.총건물수}개</p>
                            <p><strong>다중이용건물 수:</strong> ${data.summaryDetails.다중이용건물수}개</p>
                            <p><strong>최고 지상층수:</strong> ${data.summaryDetails.최고지상층수}층</p>
                            <p><strong>가목 연면적 합계:</strong> ${data.summaryDetails.가목_연면적_합계.toFixed(2)}㎡</p>
                            <p><strong>가목 대표 용도:</strong> ${data.summaryDetails.가목_대표_용도 || '없음'}</p>
                        `;
                    } else if (data.status === 'ok_fallback') {
                        cardClass = 'fallback';
                        statusText = '성공 (승강기 정보 기반 - 건축물대장 미조회)';
                        rawDataSource = '승강기 정보 상세';
                        rawDataContent = {
                            elevatorCount: data.summaryDetails.elevatorCount,
                            elevatorMaxFloor: data.summaryDetails.elevatorMaxFloor,
                            // 실제 승강기 API 원본 항목을 여기에 포함할 수도 있습니다.
                            // 예: elevatorItems: data.elevatorItems // 서버에서 이 필드를 추가로 넘겨준다면
                        };
                        rawDataSummary = `
                            <p><strong>조회된 승강기 수:</strong> ${data.summaryDetails.elevatorCount}개</p>
                            <p><strong>최고 지상층수 (승강기 기준):</strong> ${data.summaryDetails.elevatorMaxFloor}층</p>
                            <p class="text-warning">⚠️ 건축물대장 정보가 없어 승강기 정보로 대체되었습니다.</p>
                        `;
                    }

                    resultsDiv.innerHTML = `
                        <div class="card result-card ${cardClass} mb-3">
                            <div class="card-body">
                                <h5 class="card-title">조회 결과: ${statusText}</h5>
                                <p class="card-text"><strong>주소:</strong> ${data.addressInfo.roadAddr} (${data.addressInfo.jibun})</p>
                                <p class="card-text"><strong>다중이용건축물 여부:</strong> <span class="fw-bold">${data.analysis.llmFinalDecision}</span></p>
                                <p class="card-text"><strong>판단 근거:</strong> ${data.analysis.llmReason}</p>
                                <hr>
                                <h6>데이터 요약:</h6>
                                ${rawDataSummary}
                                <button class="btn btn-sm btn-info mt-2" type="button" data-bs-toggle="collapse" data-bs-target="#rawDataCollapse" aria-expanded="false" aria-controls="rawDataCollapse">
                                    ${rawDataSource} 보기
                                </button>
                                <div class="collapse mt-2" id="rawDataCollapse">
                                    <div class="json-viewer">
                                        <pre>${JSON.stringify(rawDataContent, null, 2)}</pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    cardClass = 'fail';
                    resultsDiv.innerHTML = `
                        <div class="card result-card ${cardClass} mb-3">
                            <div class="card-body">
                                <h5 class="card-title text-danger">조회 실패</h5>
                                <p class="card-text"><strong>오류:</strong> ${data.error || '알 수 없는 오류'}</p>
                                <p class="card-text"><strong>상세:</strong> ${data.detail || '상세 정보 없음'}</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('클라이언트 측 오류 발생:', error);
                resultsDiv.innerHTML = `
                    <div class="card result-card fail mb-3">
                        <div class="card-body">
                            <h5 class="card-title text-danger">조회 중 예상치 못한 오류 발생</h5>
                            <p class="card-text">서버 연결 상태를 확인해 주세요. (네트워크 또는 서버 응답 문제)</p>
                            <p class="card-text">개발자 콘솔을 확인하여 상세 오류를 볼 수 있습니다.</p>
                        </div>
                    </div>
                `;
            } finally {
                loadingIndicator.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
